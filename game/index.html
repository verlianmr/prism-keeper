<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Keeper</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #6a7392; font-size: 12px; letter-spacing: .08em; pointer-events: none;
    text-shadow: 0 0 8px #000; user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">MOUSE aim &nbsp;·&nbsp; CLICK / SPACE fire &nbsp;·&nbsp; 1 2 3 switch colour &nbsp;·&nbsp; P pause</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
